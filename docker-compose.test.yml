name: deus-test # isolated project: own containers, network and volume

# Only the dependencies needed by `go test -tags=integration`.
# Runs side-by-side with the sandbox stack: no shared volumes or host ports.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deus
      POSTGRES_PASSWORD: deus
      POSTGRES_DB: deus_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deus -d deus_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:management
    environment:
      - RABBITMQ_DEFAULT_USER=deus_user
      - RABBITMQ_DEFAULT_PASS=deus_pass
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  pgdata:
